<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rayan // 2009</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
        }
        .pfp {
            width: 110px;
            height: 110px;
            border-radius: 22px; 
            object-fit: cover;
            margin-bottom: 20px;
            transform: rotate(-3deg); 
            border: 2px solid #38bdf8;
            transition: transform 0.3s ease;
        }
        .pfp:hover {
            transform: rotate(0deg) scale(1.05);
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.05em;
        }
        p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .links-gap {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }
        .link-item:hover {
            background: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .email-text {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-top: 25px;
            display: block;
            text-decoration: none;
            color: inherit;
        }
        .email-text:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="./me.jpeg" alt="me" class="pfp">
        
        <h1>Rayan.</h1>
        <p>My Socials</p>

        <div class="links-gap">
            <a href="https://instagram.com/rayan0riginal" class="link-item" target="_blank">
                Instagram (@rayan0riginal)
            </a>
            
            <a href="mailto:rayanoriginal2009@gmail.com" class="email-text">
                rayanoriginal2009@gmail.com
            </a>
        </div>
    </div>

</body>
</html>
